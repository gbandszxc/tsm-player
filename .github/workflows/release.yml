name: 发布 Android APK
run-name: TSM Player ${{ inputs.version }}${{ inputs.overwrite && '（覆盖附件）' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 1.2.0
        required: true
        type: string
      release_notes:
        description: Markdown 更新日志。覆盖附件时留空可保留原说明
        type: string
      overwrite:
        description: 从现有版本标签重新构建并覆盖两个 APK
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      OVERWRITE: ${{ inputs.overwrite }}

    steps:
      - name: 确定构建版本和源码
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:VERSION -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw '版本号必须是 x.y.z 格式'
          }
          $tag = "v$env:VERSION"
          $source = $env:GITHUB_SHA
          if ($env:OVERWRITE -eq 'true') {
            gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName | Out-Null
            $source = "refs/tags/$tag"
          } elseif ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            throw '发布新版本必须填写更新日志'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "ref=$source"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: 准备 Gradle 版本
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $buildFile = (Resolve-Path -LiteralPath app/build.gradle).Path
          $gradle = [IO.File]::ReadAllText($buildFile)
          $namePattern = '(?m)^([ \t]*versionName[ \t]+)"([^"]+)"'
          $version = [regex]::Match($gradle, $namePattern).Groups[2].Value
          if ($env:OVERWRITE -eq 'true') {
            if ($version -ne $env:VERSION) { throw '标签源码的 versionName 与请求版本不一致' }
            return
          }
          if (git ls-remote --refs --tags origin "refs/tags/v$env:VERSION") {
            throw '标签已存在，请勾选覆盖附件'
          }
          if ([version]$env:VERSION -lt [version]$version) { throw '新版本号小于源码中的版本号' }
          if ($version -eq $env:VERSION) { return }

          $codePattern = '(?m)^([ \t]*versionCode[ \t]+)([0-9]+)(?=[ \t]*\r?$)'
          if ($gradle -notmatch $codePattern) { throw '无法读取 versionCode' }
          $nextCode = [int]$Matches[2] + 1
          $gradle = $gradle -replace $namePattern, { $_.Groups[1].Value + '"' + $env:VERSION + '"' }
          $gradle = $gradle -replace $codePattern, { $_.Groups[1].Value + $nextCode }
          [IO.File]::WriteAllText($buildFile, $gradle)

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 测试并打包
        shell: pwsh
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          RELEASE_SIGNING_PROPERTIES: ${{ secrets.ANDROID_RELEASE_SIGNING_PROPERTIES }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:RELEASE_KEYSTORE -or -not $env:RELEASE_SIGNING_PROPERTIES) {
            throw '仓库缺少 Android 发版签名 Secrets'
          }
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManager --install 'platforms;android-34' 'build-tools;34.0.0'

          $keystorePath = Join-Path $env:GITHUB_WORKSPACE 'release.jks'
          $propertiesPath = Join-Path $env:GITHUB_WORKSPACE 'key.properties'
          try {
            [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:RELEASE_KEYSTORE))
            $properties = [Text.Encoding]::Latin1.GetString([Convert]::FromBase64String($env:RELEASE_SIGNING_PROPERTIES))
            $newline = [Environment]::NewLine
            [IO.File]::WriteAllText($propertiesPath, ($properties + $newline + 'storeFile=../release.jks' + $newline), [Text.Encoding]::Latin1)
            Remove-Item Env:RELEASE_KEYSTORE, Env:RELEASE_SIGNING_PROPERTIES
            .\gradlew.bat --no-daemon testDebugUnitTest assembleDebug assembleRelease
          } finally {
            Remove-Item -LiteralPath $propertiesPath, $keystorePath -ErrorAction SilentlyContinue
          }

      - name: 校验签名并发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_CERT_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw '仓库缺少有效的 ANDROID_RELEASE_CERT_SHA256'
          }
          $tag = "v$env:VERSION"
          $apkDir = 'app/build/outputs/apk/release'
          $apksigner = Join-Path $env:ANDROID_HOME 'build-tools/34.0.0/apksigner.bat'
          $apks = foreach ($abi in 'armeabi-v7a', 'arm64-v8a') {
            $file = Get-Item -LiteralPath "$apkDir/tsm-player-release-$abi-$env:VERSION.apk"
            $signers = (& $apksigner verify --print-certs $file.FullName | Select-String '^Signer #\d+ certificate SHA-256 digest: (.+)$')
            if (@($signers).Count -ne 1 -or $signers.Matches[0].Groups[1].Value -ne $env:RELEASE_CERT_SHA256) {
              throw "APK 签名与发版证书不一致：$($file.Name)"
            }
            $file
          }

          $notesFile = Join-Path $env:RUNNER_TEMP 'tsm-release-notes.md'
          $hasNotes = -not [string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)
          if ($hasNotes) { [IO.File]::WriteAllText($notesFile, $env:RELEASE_NOTES) }
          $files = $apks.FullName
          if ($env:OVERWRITE -ne 'true') {
            if (git status --porcelain -- app/build.gradle) {
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -- app/build.gradle
              git commit -m "chore(release): 更新版本至 $env:VERSION"
              gh auth setup-git --hostname github.com
              git push origin HEAD:refs/heads/main
            }
            $target = (git rev-parse HEAD).Trim()
            gh release create $tag @files --title $tag --notes-file $notesFile --target $target
            exit 0
          }

          $repoApi = "repos/$env:GITHUB_REPOSITORY"
          $release = gh api "$repoApi/releases/tags/$tag" | ConvertFrom-Json
          $releaseApi = "$repoApi/releases/$($release.id)"
          $assetsApi = "$repoApi/releases/assets"
          $suffix = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $replacements = foreach ($apk in $apks) {
            $incoming = "$($apk.BaseName)-incoming-$suffix.apk"
            $staged = Join-Path $env:RUNNER_TEMP $incoming
            Copy-Item -LiteralPath $apk.FullName -Destination $staged
            [pscustomobject]@{
              Name = $apk.Name
              Digest = "sha256:$((Get-FileHash -LiteralPath $apk.FullName).Hash.ToLowerInvariant())"
              Original = $release.assets | Where-Object name -CEQ $apk.Name
              Incoming = $incoming
              Backup = "$($apk.BaseName)-previous-$suffix.apk"
              Staged = $staged
              NewId = $null
              BackedUp = $false
              Installed = $false
            }
          }
          try {
            $stagedFiles = $replacements.Staged
            gh release upload $tag @stagedFiles
            $assets = (gh api $releaseApi | ConvertFrom-Json).assets
            foreach ($item in $replacements) {
              $uploaded = $assets | Where-Object name -CEQ $item.Incoming
              if ($uploaded.digest -ne $item.Digest) { throw "上传后的 APK 校验失败：$($item.Name)" }
              $item.NewId = $uploaded.id
            }

            foreach ($item in $replacements) {
              if ($item.Original) {
                gh api --method PATCH "$assetsApi/$($item.Original.id)" -f "name=$($item.Backup)" --silent
                $item.BackedUp = $true
              }
              gh api --method PATCH "$assetsApi/$($item.NewId)" -f "name=$($item.Name)" --silent
              $item.Installed = $true
            }
            if ($hasNotes) { gh release edit $tag --notes-file $notesFile }
          } catch {
            foreach ($item in $replacements) {
              try {
                if ($item.Installed) {
                  gh api --method PATCH "$assetsApi/$($item.NewId)" -f "name=$($item.Incoming)" --silent
                }
                if ($item.BackedUp) {
                  gh api --method PATCH "$assetsApi/$($item.Original.id)" -f "name=$($item.Name)" --silent
                }
              } catch {
                Write-Warning "请恢复旧 APK 附件名：$($item.Backup)"
              }
            }
            try {
              $incomingNames = $replacements.Incoming
              $assets = (gh api $releaseApi | ConvertFrom-Json).assets
              foreach ($asset in $assets) {
                if ($asset.name -cin $incomingNames) {
                  gh api --method DELETE "$assetsApi/$($asset.id)" --silent
                }
              }
            } catch {
              Write-Warning "部分临时附件可能需要清理，附件名后缀：incoming-$suffix"
            }
            throw
          }

          foreach ($item in $replacements) {
            if ($item.Original) { gh api --method DELETE "$assetsApi/$($item.Original.id)" --silent }
          }
